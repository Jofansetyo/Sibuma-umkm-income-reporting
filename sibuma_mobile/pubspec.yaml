name: sibuma_mobile
description: "Sistem Informasi Bisnis Usaha Madiun"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'


dependencies:
  flutter:
    sdk: flutter

  # HTTP Client
  http: ^1.6.0
  
  # Local Storage
  shared_preferences: ^2.2.2
  
  # State Management
  provider: ^6.1.5+1
  
  # Formatting (Currency & Date)
  intl: ^0.20.2
  
  # Icons
  cupertino_icons: ^1.0.2
  flutter_secure_storage: ^10.0.0
  fl_chart: ^1.1.1
  google_fonts: ^8.0.2
  flutter_svg: ^2.2.3

  # Membuka telepon, email, WhatsApp, dll
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/